<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>견적문의 - 세종로합동법무사</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #1a365d; min-height: 100vh; padding: 40px 20px; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
        input, textarea, button { font-family: inherit; letter-spacing: inherit; }
        .form-container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .form-header { background: #1a365d; color: #fff; padding: 30px; text-align: center; }
        .form-brand { font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 700; color: #dfe2e6; letter-spacing: 0.08em; margin-bottom: 4px; }
        .form-header h1 { font-family: 'Noto Serif KR', serif; font-size: 17px; font-weight: 700; color: #C9A227; letter-spacing: 0.3em; margin-bottom: 10px; }
        .form-header p { font-family: 'Noto Serif KR', serif; font-size: 11.5px; color: #dfe2e6; opacity: 0.8; letter-spacing: 0.01em; }
        .form-body { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; color: #1a365d; margin-bottom: 8px; font-size: 14px; }
        .form-group label .required { color: #e53e3e; margin-left: 2px; }
        .form-group input[type="text"], .form-group input[type="email"], .form-group input[type="tel"], .form-group textarea { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px; transition: border-color 0.3s, box-shadow 0.3s; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #1a365d; box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.1); }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .file-upload-area { border: 2px dashed #cbd5e0; border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; transition: all 0.3s; background: #f7fafc; }
        .file-upload-area:hover { border-color: #1a365d; background: #edf2f7; }
        .file-upload-area input[type="file"] { display: none; }
        .file-upload-icon { font-size: 40px; color: #a0aec0; margin-bottom: 10px; }
        .file-upload-text { color: #718096; font-size: 14px; }
        .file-upload-text span { color: #1a365d; font-weight: 600; }
        .file-list { margin-top: 15px; }
        .file-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #edf2f7; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
        .file-item-info { display: flex; align-items: center; gap: 8px; }
        .file-item-icon { width: 32px; height: 32px; background: #1a365d; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: bold; }
        .file-item-name { color: #2d3748; font-weight: 500; }
        .file-item-size { color: #a0aec0; font-size: 12px; }
        .file-remove { background: #e53e3e; border: none; color: #fff; cursor: pointer; font-size: 14px; padding: 6px 10px; border-radius: 4px; }
        .file-remove:hover { background: #c53030; }
        .inquiry-types { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .inquiry-type input { display: none; }
        .inquiry-type label { display: block; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; text-align: center; cursor: pointer; font-weight: 500; }
        .inquiry-type input:checked + label { border-color: #1a365d; background: #edf2f7; color: #1a365d; }
        .submit-btn { width: 100%; padding: 16px; background: #1a365d; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(26, 54, 93, 0.4); }
        .privacy-check { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px; font-size: 13px; color: #718096; }
        .privacy-check input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; accent-color: #1a365d; }
        .contact-info { background: #f7fafc; border-radius: 8px; padding: 20px; margin-top: 20px; text-align: center; }
        .contact-info p { color: #718096; font-size: 13px; margin-bottom: 5px; }
        .contact-info strong { color: #1a365d; }
        @media (max-width: 480px) { .inquiry-types { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <div class="form-brand">세종로합동법무사</div>
            <h1>견적문의</h1>
            <p>SeJongLaw Certified Judicial Scriveners Joint Office</p>
        </div>
        <div class="form-body">
            <form id="inquiryForm" action="https://formspree.io/f/mbddvglj" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label>문의 유형 <span class="required">*</span></label>
                    <div class="inquiry-types">
                        <div class="inquiry-type"><input type="radio" name="inquiryType" id="type1" value="법인등기" required><label for="type1">법인등기</label></div>
                        <div class="inquiry-type"><input type="radio" name="inquiryType" id="type2" value="부동산등기"><label for="type2">부동산등기</label></div>
                        <div class="inquiry-type"><input type="radio" name="inquiryType" id="type3" value="상속/증여"><label for="type3">상속/증여</label></div>
                        <div class="inquiry-type"><input type="radio" name="inquiryType" id="type4" value="기타문의"><label for="type4">기타문의</label></div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="name">이름 (회사명) <span class="required">*</span></label>
                    <input type="text" id="name" name="name" placeholder="이름 또는 회사명을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label for="phone">연락처 <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" required>
                </div>
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label for="message">문의 내용 <span class="required">*</span></label>
                    <textarea id="message" name="message" placeholder="문의하실 내용 작성 부탁드립니다." required></textarea>
                </div>
                <div class="form-group">
                    <label>파일 첨부 <span style="font-weight:normal;color:#a0aec0">(PDF, PNG, JPG - 최대 10MB)</span></label>
                    <div class="file-upload-area" id="dropZone">
                        <div class="file-upload-icon">📎</div>
                        <p class="file-upload-text">파일을 드래그하거나 <span>클릭하여 선택</span>하세요</p>
                        <input type="file" id="fileInput" name="attachment" multiple accept=".pdf,.png,.jpg,.jpeg,.doc,.docx,.hwp">
                    </div>
                    <div class="file-list" id="fileList"></div>
                </div>
                <div class="privacy-check">
                    <input type="checkbox" id="privacy" required>
                    <label for="privacy">개인정보 수집 및 이용에 동의합니다.</label>
                </div>
                <button type="submit" class="submit-btn">견적문의 보내기</button>
            </form>
            <div class="contact-info">
                <p>급한 문의는 전화로 연락주세요</p>
                <p><strong>📞 02-318-8028</strong></p>
                <p><strong>✉️ son@jonglaw.co.kr</strong></p>
            </div>
        </div>
    </div>
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        let uploadedFiles = [];

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
        dropZone.addEventListener('drop', (e) => { e.preventDefault(); addFiles(e.dataTransfer.files); });
        fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });

        function addFiles(files) {
            Array.from(files).forEach(file => {
                if (file.size > 10 * 1024 * 1024) { alert(file.name + ' 파일이 너무 큽니다. (최대 10MB)'); return; }
                if (!uploadedFiles.some(f => f.name === file.name)) uploadedFiles.push(file);
            });
            updateFileList();
            updateFormData();
        }

        function removeFile(index) {
            uploadedFiles.splice(index, 1);
            updateFileList();
            updateFormData();
        }

        function updateFileList() {
            fileList.innerHTML = uploadedFiles.map((file, i) => 
                '<div class="file-item"><div class="file-item-info"><div class="file-item-icon">' + file.name.split('.').pop().toUpperCase().slice(0,3) + '</div><div><div class="file-item-name">' + file.name + '</div><div class="file-item-size">' + (file.size/1024/1024).toFixed(2) + ' MB</div></div></div><button type="button" class="file-remove" onclick="removeFile(' + i + ')">삭제</button></div>'
            ).join('');
        }

        function updateFormData() {
            const dt = new DataTransfer();
            uploadedFiles.forEach(file => dt.items.add(file));
            fileInput.files = dt.files;
        }

        document.getElementById('phone').addEventListener('input', function(e) {
            let v = e.target.value.replace(/[^0-9]/g, '');
            if (v.length > 3 && v.length <= 7) v = v.slice(0,3) + '-' + v.slice(3);
            else if (v.length > 7) v = v.slice(0,3) + '-' + v.slice(3,7) + '-' + v.slice(7,11);
            e.target.value = v;
        });
    </script>
</body>
</html>
